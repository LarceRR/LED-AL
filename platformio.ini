[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200

; Use FastLED's WS2812-over-SPI backend instead of RMT. The SPI backend
; uses the ESP-IDF LED-strip SPI driver with DMA where supported.
build_unflags = -Os
build_flags = -O2 -D FASTLED_ESP32_USE_CLOCKLESS_SPI

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web.py

lib_deps =
    fastled/FastLED@3.9.15
    bblanchon/ArduinoJson@7.4.2
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
