[env:esp32dev]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200

; Keep the optimized build, but use FastLED's default ESP32 RMT transport
; while isolating the Wi-Fi startup brownout from the I2S DMA configuration.
build_unflags = -Os
build_flags = -O2

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web.py

lib_deps =
    fastled/FastLED@3.9.15
    bblanchon/ArduinoJson@7.4.2
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
